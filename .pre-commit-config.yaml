# Hook configuration shared by prek (https://prek.j178.dev) and pre-commit.
# Local:  prek run --all-files        (or: pre-commit run --all-files)
# CI:     the "prek" job in .github/workflows/ci.yml runs the same hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ["--fix"]
