<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Five Big Things — offline</title>
  <style>
    body{margin:0;background:#f5f4ef;color:#20241f;font-family:-apple-system,'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:650px;margin:0 auto;padding:80px 24px;text-align:center}
    .mark{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:14px;background:#234b3c;color:#caeb8b;font-size:30px;font-weight:700}
    h1{font-size:32px;letter-spacing:-.03em;margin:24px 0 10px}
    p{font-size:14px;line-height:1.7;color:#777b71}
    button{margin-top:20px;border:0;border-radius:8px;padding:13px 22px;font-size:13px;font-weight:600;background:#234b3c;color:#fff;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <span class="mark">5</span>
    <h1>You're offline.</h1>
    <p>Today's round needs a connection — five fresh questions are waiting.<br>If you've played before, a practice round may still work from cache.</p>
    <button onclick="location.href='/'">Try again ↗</button>
  </main>
</body>
</html>
