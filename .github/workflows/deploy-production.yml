name: Deploy to production

# Manual only. The job is bound to the GitHub "production" environment;
# configure required reviewers on it (Settings > Environments > production)
# so a human approves every production deploy. Deploys the service_id that
# is committed in fastly.toml.
#
# The ref is resolved to an exact commit SHA by the "resolve" job, which
# runs before the environment approval gate. The gated deploy job checks
# out that SHA, so what gets deployed is exactly the revision that was
# dispatched and approved — never a newer commit that landed on the ref
# while the run waited for approval.
#
# Build/deploy runs the Fastly CLI directly (installed by the
# compute-actions setup step) instead of the full compute-actions
# action: that action's build step uploads the package as a GitHub
# artifact in a post step, and GitHub rejects the "five-big-things.tar"
# artifact name, failing the run after a successful deploy
# (production run #1, 2026-11-19).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to deploy"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve-ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy-production
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fivebigthings.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Set up Fastly CLI
        uses: fastly/compute-actions/setup@v5
      - name: Build and deploy to production
        run: fastly compute deploy --non-interactive
        env:
          FASTLY_API_TOKEN: ${{ secrets.FASTLY_API_TOKEN }}
